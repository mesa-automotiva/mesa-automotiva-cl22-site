<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Links oficiais dos apps Mesa Automotiva: Play Store, Instagram e TikTok."
    />
    <meta name="theme-color" content="#2b0303" />
    <title>Mesa Automotiva CL22</title>
    <link rel="icon" href="assets/app-icon.jpg" />
    <style>
      :root {
        color-scheme: dark;
        --red-950: #160101;
        --red-900: #260303;
        --red-800: #3a0505;
        --red-700: #5f0909;
        --red-500: #d01818;
        --cream: #fff2e8;
        --muted: #d6b4a9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }

      body {
        height: auto;
        min-height: 100svh;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at 50% 0%, rgba(208, 24, 24, 0.38), transparent 36%),
          linear-gradient(145deg, var(--red-950), var(--red-900) 48%, #080000);
        color: var(--cream);
      }

      .page {
        width: min(100%, 520px);
        min-height: 100svh;
        margin: 0 auto;
        padding: clamp(18px, 4svh, 42px) 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 2.8svh, 24px);
        text-align: center;
      }

      .app-icon {
        width: clamp(92px, 18svh, 140px);
        aspect-ratio: 1;
        border-radius: 28px;
        object-fit: cover;
        box-shadow:
          0 22px 55px rgba(0, 0, 0, 0.48),
          0 0 0 3px rgba(255, 242, 232, 0.16),
          0 0 42px rgba(208, 24, 24, 0.44);
      }

      .intro {
        display: grid;
        gap: 7px;
      }

      .eyebrow {
        margin: 0;
        color: #ffb8a8;
        font-size: clamp(12px, 2.1svh, 14px);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7svh, 54px);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: clamp(14px, 2.4svh, 18px);
        font-weight: 700;
      }

      .links {
        width: 100%;
        display: grid;
        gap: clamp(10px, 1.8svh, 14px);
      }

      .link-button {
        min-height: clamp(58px, 9.5svh, 72px);
        padding: 10px 18px;
        display: grid;
        grid-template-columns: 46px 1fr;
        align-items: center;
        gap: 14px;
        color: var(--cream);
        text-decoration: none;
        text-align: left;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
          rgba(32, 2, 2, 0.82);
        border: 1px solid rgba(255, 210, 196, 0.18);
        border-radius: 0;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      }

      .app-link {
        grid-template-columns: 46px 1fr 46px;
      }

      .app-thumbnail {
        width: 46px;
        height: 46px;
        object-fit: cover;
      }

      .link-button:focus-visible,
      .link-button:hover {
        outline: none;
        border-color: rgba(255, 242, 232, 0.46);
        background:
          linear-gradient(180deg, rgba(208, 24, 24, 0.28), rgba(255, 255, 255, 0.03)),
          rgba(45, 3, 3, 0.92);
      }

      .logo {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
      }

      .logo svg {
        width: 32px;
        height: 32px;
        display: block;
      }

      .button-copy {
        min-width: 0;
        display: grid;
        gap: 2px;
      }

      .button-copy strong {
        font-size: clamp(18px, 3svh, 22px);
        line-height: 1.05;
      }

      .button-copy span {
        color: var(--muted);
        font-size: clamp(13px, 2.3svh, 16px);
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .play-blue {
        fill: #00a0ff;
      }

      .play-green {
        fill: #00d95f;
      }

      .play-yellow {
        fill: #ffd500;
      }

      .play-red {
        fill: #ff3d28;
      }

      .tik-cyan {
        fill: #25f4ee;
      }

      .tik-red {
        fill: #fe2c55;
      }

      .tik-white {
        fill: #ffffff;
      }

      @media (max-height: 610px) {
        .page {
          gap: 10px;
          padding-block: 14px;
        }

        .intro {
          gap: 4px;
        }

        .link-button {
          min-height: 54px;
          border-radius: 0;
        }

        .logo {
          width: 42px;
          height: 42px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Mesa Automotiva CL22">
      <img class="app-icon" src="assets/app-icon.jpg" alt="Icone do app Mesa Automotiva CL22" />

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Aplicativo oficial</p>
        <h1 id="page-title">Mesa Automotiva CL22</h1>
        <p class="subtitle">Som automotivo na palma da mao</p>
      </section>

      <nav class="links" aria-label="Links oficiais">
        <a
          class="link-button app-link"
          href="https://play.google.com/store/apps/details?id=com.mesaautomotiva.cl23"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <path class="play-blue" d="M8 5.5v37l18.2-18.5L8 5.5Z" />
              <path class="play-green" d="M9.8 4.6 36.4 19.7 26.2 24 9.8 4.6Z" />
              <path class="play-yellow" d="M9.8 43.4 26.2 24l10.2 4.3L9.8 43.4Z" />
              <path class="play-red" d="M26.2 24 36.4 19.7 42 23c1.4.8 1.4 2.2 0 3l-5.6 2.3L26.2 24Z" />
            </svg>
          </span>
          <span class="button-copy">
            <strong>Play Store</strong>
            <span>Mesa Automotiva CL22</span>
          </span>
          <img class="app-thumbnail" src="assets/app-icon.jpg" alt="Miniatura do app Mesa Automotiva CL22" />
        </a>

        <a
          class="link-button app-link"
          href="https://play.google.com/store/apps/details?id=com.mesaautomotiva.cl23v2"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <path class="play-blue" d="M8 5.5v37l18.2-18.5L8 5.5Z" />
              <path class="play-green" d="M9.8 4.6 36.4 19.7 26.2 24 9.8 4.6Z" />
              <path class="play-yellow" d="M9.8 43.4 26.2 24l10.2 4.3L9.8 43.4Z" />
              <path class="play-red" d="M26.2 24 36.4 19.7 42 23c1.4.8 1.4 2.2 0 3l-5.6 2.3L26.2 24Z" />
            </svg>
          </span>
          <span class="button-copy">
            <strong>Play Store</strong>
            <span>Equalizador Automotivo</span>
          </span>
          <img class="app-thumbnail" src="assets/equalizador-automotivo-icon.webp" alt="Miniatura do app Equalizador Automotivo" />
        </a>

        <a
          class="link-button"
          href="https://www.instagram.com/mesa_automotiva?igsh=dzlzZTd3NW53b2U5"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <defs>
                <linearGradient id="instagram-gradient" x1="8" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#feda75" />
                  <stop offset="0.28" stop-color="#fa7e1e" />
                  <stop offset="0.52" stop-color="#d62976" />
                  <stop offset="0.75" stop-color="#962fbf" />
                  <stop offset="1" stop-color="#4f5bd5" />
                </linearGradient>
              </defs>
              <rect x="6" y="6" width="36" height="36" rx="10" fill="url(#instagram-gradient)" />
              <circle cx="24" cy="24" r="8.3" fill="none" stroke="#ffffff" stroke-width="3.2" />
              <circle cx="34.2" cy="13.8" r="2.7" fill="#ffffff" />
            </svg>
          </span>
          <span class="button-copy">
            <strong>Instagram</strong>
            <span>@mesa_automotiva</span>
          </span>
        </a>

        <a
          class="link-button"
          href="https://www.tiktok.com/@mesaautomotiva"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <path class="tik-cyan" d="M31.2 5.8c.8 6.1 4.3 10.4 10.3 11.3v7.4c-3.8.1-7.1-.9-10.1-3v12.4c0 7.4-5.8 13.1-13.1 13.1C11 47 5.5 41.6 5.5 34.6c0-7.1 5.7-12.5 12.8-12.5.9 0 1.7.1 2.6.3v7.7c-.8-.3-1.5-.4-2.4-.4-2.8 0-5 2.1-5 4.9 0 2.9 2.2 5 5 5s5-2.1 5-5V5.8h7.7Z" />
              <path class="tik-red" d="M33.2 7.8c.8 6.1 4.3 10.4 10.3 11.3v7.4c-3.8.1-7.1-.9-10.1-3v12.4c0 7.4-5.8 13.1-13.1 13.1C13 49 7.5 43.6 7.5 36.6c0-7.1 5.7-12.5 12.8-12.5.9 0 1.7.1 2.6.3v7.7c-.8-.3-1.5-.4-2.4-.4-2.8 0-5 2.1-5 4.9 0 2.9 2.2 5 5 5s5-2.1 5-5V7.8h7.7Z" />
              <path class="tik-white" d="M32.1 6.8c.8 6.1 4.3 10.4 10.3 11.3v7.4c-3.8.1-7.1-.9-10.1-3v12.4c0 7.4-5.8 13.1-13.1 13.1C11.9 48 6.4 42.6 6.4 35.6c0-7.1 5.7-12.5 12.8-12.5.9 0 1.7.1 2.6.3v7.7c-.8-.3-1.5-.4-2.4-.4-2.8 0-5 2.1-5 4.9 0 2.9 2.2 5 5 5s5-2.1 5-5V6.8h7.7Z" />
            </svg>
          </span>
          <span class="button-copy">
            <strong>TikTok</strong>
            <span>@mesaautomotiva</span>
          </span>
        </a>
      </nav>
    </main>
  </body>
</html>
